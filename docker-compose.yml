# Merrill Digital Systems – Raspberry Pi with Cloudflare Tunnel
# Usage: docker compose up -d

services:
  web:
    build: .
    container_name: merrill-digital-systems
    restart: unless-stopped
    # 8080 is not arbitrary — it is what the tunnel asks for. Production
    # traffic arrives via a cloudflared running on the HOST (not the `tunnel`
    # service below), whose config at
    # /home/kruzer04/.cloudflared/merrill-config.yml routes
    # merrilldigitalsystems.com to http://127.0.0.1:8080.
    #
    # Do NOT map 80 or 443: Caddy owns :80 on this Pi, and a collision leaves
    # the container stuck in "Created" while the site 502s.
    ports:
      - "8080:80"
    volumes:
      # Mount Cloudflare origin certificates (keep these outside the repo)
      - ./certs:/etc/nginx/certs:ro

  # NOT the connector serving this site. This is tunnel 9a12078f…; production
  # runs through a host-level cloudflared on tunnel f4a3b1b5… (see the note on
  # `web` above). Restarting this one does nothing for the live site, and
  # running both has caused "control stream encountered a failure" retry loops.
  #
  # Left in place because it is what DEPLOY.md documents and removing it is a
  # separate decision. If it keeps flapping, `docker compose stop tunnel` is
  # safe — it carries no traffic.
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-tunnel
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - web
