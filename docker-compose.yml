# Merrill Digital Systems – Raspberry Pi with Cloudflare Tunnel
# Usage: docker compose up -d

services:
  web:
    build: .
    container_name: merrill-digital-systems
    restart: unless-stopped
    # No host ports on purpose. The Cloudflare Tunnel reaches this container
    # over the compose network at https://web:443, so publishing 80/443 on the
    # host adds nothing and actively breaks the deploy: Caddy holds :80 on this
    # Pi, so the bind fails and the container never leaves "Created".
    #
    # For local debugging on the Pi, uncomment and hit http://<pi-ip>:8080
    # (8080 rather than 80, so it can't collide again):
    # ports:
    #   - "8080:80"
    volumes:
      # Mount Cloudflare origin certificates (keep these outside the repo)
      - ./certs:/etc/nginx/certs:ro

  # Cloudflare Tunnel – connects your Pi to Cloudflare without port forwarding
  # Set TUNNEL_TOKEN in your .env file (see DEPLOY.md for steps)
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-tunnel
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - web
