# Merrill Digital Systems – Raspberry Pi with Cloudflare Tunnel
# Usage: docker compose up -d

services:
  web:
    build: .
    container_name: merrill-digital-systems
    restart: unless-stopped
    # The real request path on this Pi:
    #
    #   visitor -> Cloudflare edge
    #           -> cloudflared on the HOST (pid ~1808, tunnel f4a3b1b5...,
    #              config ~/.cloudflared/merrill-config.yml)
    #           -> http://127.0.0.1:8080  = Caddy (pid ~1812,
    #              ~/.config/caddy/Caddyfile), which also fronts
    #              baysbakedgoods.com
    #           -> reverse_proxy 127.0.0.1:8081  = this container
    #
    # 8081 because Caddy holds 8080, a second Caddy holds 80, and Bay's app
    # holds 3001. Mapping 80 or 443 here collides and leaves the container
    # stuck in "Created" while the site keeps serving stale content.
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      # Mount Cloudflare origin certificates (keep these outside the repo)
      - ./certs:/etc/nginx/certs:ro

  # NOT the connector serving this site. This is tunnel 9a12078f…; production
  # runs through a host-level cloudflared on tunnel f4a3b1b5… (see the note on
  # `web` above). Restarting this one does nothing for the live site, and
  # running both has caused "control stream encountered a failure" retry loops.
  #
  # Left in place because it is what DEPLOY.md documents and removing it is a
  # separate decision. If it keeps flapping, `docker compose stop tunnel` is
  # safe — it carries no traffic.
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-tunnel
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - web
