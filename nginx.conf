# Merrill Digital Systems — nginx config for Docker.
# Serves the Next.js static export (out/) behind Cloudflare Tunnel.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # ── HTTP → HTTPS redirect ──
  server {
    listen 80;
    server_name _;

    # Health check for Cloudflare Tunnel
    location = /healthz {
      return 200 "ok";
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ── www → apex (plain HTTP) ──
  # Without this, www on :80 hits the catch-all above and takes two hops.
  server {
    listen 80;
    server_name www.merrilldigitalsystems.com;
    return 301 https://merrilldigitalsystems.com$request_uri;
  }

  # ── www → apex (HTTPS) ──
  server {
    listen 443 ssl;
    server_name www.merrilldigitalsystems.com;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    return 301 https://merrilldigitalsystems.com$request_uri;
  }

  # ── Canonical origin ──
  server {
    listen 443 ssl;
    server_name merrilldigitalsystems.com;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Next fingerprints everything under /_next/static, so it can be cached
    # forever. This is what replaced the hand-edited ?v= cache busting.
    location ^~ /_next/static/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # HTML always revalidates so content updates show immediately.
    location ~* \.html$ {
      add_header Cache-Control "no-cache, must-revalidate";
      add_header Pragma "no-cache";
      add_header Expires "0";
    }

    location ~* \.(svg|jpg|jpeg|png|webp|avif|ico|woff2?)$ {
      add_header Cache-Control "public, max-age=604800";
    }

    # Next emits every generated image as an EXTENSIONLESS file, so nginx would
    # otherwise serve them as application/octet-stream — social platforms would
    # refuse the share card and browsers would ignore the favicon.
    location ~ ^/(opengraph-image|icon|apple-icon)$ {
      default_type image/png;
      add_header Cache-Control "public, max-age=604800";
    }

    # 301s from the pre-2026 .html URLs. Generated by
    # site/scripts/generate-redirects.mjs — never hand-edit, and never add a
    # rule here that any of those destinations would match, or you create a
    # chain (this file previously sent /terms to /terms.html, which would now
    # be an infinite loop against /terms.html → /terms).
    include /etc/nginx/redirects-mds.conf;

    location / {
      try_files $uri $uri.html $uri/ =404;
    }

    location = / {
      try_files /index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
      internal;
    }
  }
}
