# Merrill Digital Systems — nginx config for Docker.
# Serves the Next.js static export (out/) behind Cloudflare Tunnel.
#
# HOW TRAFFIC ACTUALLY REACHES THIS CONTAINER
#
#   visitor -> Cloudflare edge (terminates TLS)
#           -> cloudflared on the Pi HOST, pid from `pgrep -af cloudflared`,
#              config /home/kruzer04/.cloudflared/merrill-config.yml
#           -> http://127.0.0.1:8080   (plain HTTP, loopback)
#           -> this container's port 80  (docker-compose maps 8080:80)
#
# Three things follow from that, and each one has already broken a deploy:
#
#   1. The tunnel speaks PLAIN HTTP. A blanket ":80 -> https" redirect here
#      sends every request into an infinite loop, because Cloudflare hands it
#      straight back to cloudflared. So port 80 serves the site directly.
#      TLS is Cloudflare's job at the edge; this hop is loopback.
#   2. The host port must be 8080. Caddy owns :80 on this Pi, and the tunnel
#      config names 8080 explicitly.
#   3. The cloudflared running in docker-compose is a DIFFERENT tunnel and
#      does not carry production traffic. Restarting it changes nothing.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Cloudflare gives us the visitor's IP here; without this every log line
  # is the tunnel's loopback address.
  real_ip_header CF-Connecting-IP;
  set_real_ip_from 127.0.0.1;

  server {
    # Port 80 is the tunnel's entrypoint and serves content directly.
    # Port 443 stays available for direct HTTPS to the Pi; nginx applies the
    # certificates only to the TLS listener.
    listen 80 default_server;
    listen 443 ssl;
    server_name merrilldigitalsystems.com www.merrilldigitalsystems.com _;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /usr/share/nginx/html;
    index index.html;

    # Emit relative Location headers ("/web-design-utah") rather than absolute
    # ones. Because the tunnel hop is plain HTTP, $scheme here is "http", so
    # nginx would otherwise turn `return 301 /x` into
    # `Location: http://merrilldigitalsystems.com/x` — and Cloudflare would
    # then have to upgrade that to https, putting a second hop on all 41
    # legacy redirects. A relative Location is resolved by the client against
    # the original https URL, so the chain stays one hop.
    absolute_redirect off;
    port_in_redirect off;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Health check for the tunnel / uptime monitoring.
    location = /healthz {
      access_log off;
      return 200 "ok";
    }

    # Next fingerprints everything under /_next/static, so it can be cached
    # forever. This is what replaced the hand-edited ?v= cache busting.
    location ^~ /_next/static/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # HTML always revalidates so content updates show immediately.
    location ~* \.html$ {
      add_header Cache-Control "no-cache, must-revalidate";
      add_header Pragma "no-cache";
      add_header Expires "0";
    }

    location ~* \.(svg|jpg|jpeg|png|webp|avif|ico|woff2?)$ {
      add_header Cache-Control "public, max-age=604800";
    }

    # Next emits every generated image as an EXTENSIONLESS file, so nginx would
    # otherwise serve them as application/octet-stream — social platforms would
    # refuse the share card and browsers would ignore the favicon.
    location ~ ^/(opengraph-image|icon|apple-icon)$ {
      default_type image/png;
      add_header Cache-Control "public, max-age=604800";
    }

    # 301s from the pre-2026 .html URLs. Generated by
    # site/scripts/generate-redirects.mjs — never hand-edit, and never add a
    # rule here that any of those destinations would match, or you create a
    # chain (this file previously sent /terms to /terms.html, which would now
    # be an infinite loop against /terms.html → /terms).
    include /etc/nginx/redirects-mds.conf;

    location / {
      try_files $uri $uri.html $uri/ =404;
    }

    location = / {
      try_files /index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
      internal;
    }
  }
}
